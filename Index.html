<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Academia Concurso Angola</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#172033;
}

header{
    background:#075985;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h2{
    margin-top:10px;
}

.categorias{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-top:20px;
}

.categoria{
    border:0;
    border-radius:12px;
    padding:20px 10px;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.categoria:hover{
    background:#e0f2fe;
}

.icone{
    display:block;
    font-size:35px;
    margin-bottom:10px;
}

#simulado{
    display:none;
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

#pergunta{
    font-size:20px;
    font-weight:bold;
    margin:20px 0;
}

.opcao{
    display:block;
    width:100%;
    padding:14px;
    margin:10px 0;
    background:white;
    border:2px solid #ddd;
    border-radius:8px;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.opcao:hover{
    background:#f0f9ff;
}

.certa{
    background:#dcfce7 !important;
    border-color:#16a34a !important;
}

.errada{
    background:#fee2e2 !important;
    border-color:#dc2626 !important;
}

#explicacao{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#f8fafc;
    border-left:4px solid #075985;
}

.botoes{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.proxima{
    background:#075985;
    color:white;
}

.voltar{
    background:#e2e8f0;
}

#resultado{
    display:none;
    background:white;
    padding:30px;
    text-align:center;
    border-radius:12px;
    margin-top:20px;
}

.pontuacao{
    font-size:40px;
    font-weight:bold;
    color:#075985;
}

</style>
</head>

<body>

<header>

<h1>🎓 Academia Concurso Angola</h1>

<p>Preparação para concursos e conhecimentos gerais</p>

</header>


<div class="container">

<!-- MENU -->

<div id="inicio">

<h2>Escolha uma categoria</h2>

<div class="categorias">

<button class="categoria" onclick="iniciar('analises')">
<span class="icone">🧪</span>
Análises Clínicas
</button>

<button class="categoria" onclick="iniciar('cultura')">
<span class="icone">🌍</span>
Cultura Geral
</button>

<button class="categoria" onclick="iniciar('etica')">
<span class="icone">⚖️</span>
Ética
</button>

<button class="categoria" onclick="iniciar('censo')">
<span class="icone">📊</span>
Censo 2024
</button>

<button class="categoria" onclick="iniciar('iims')">
<span class="icone">🏥</span>
IIMS
</button>

<button class="categoria" onclick="iniciar('ia')">
<span class="icone">🤖</span>
Inteligência Artificial
</button>

</div>

</div>


<!-- SIMULADO -->

<div id="simulado">

<strong id="categoria"></strong>

<div id="contador"></div>

<div id="pergunta"></div>

<div id="opcoes"></div>

<div id="explicacao"></div>

<div class="botoes">

<button class="btn voltar" onclick="voltar()">
Voltar
</button>

<button class="btn proxima" onclick="proxima()">
Próxima
</button>

</div>

</div>


<!-- RESULTADO -->

<div id="resultado">

<h2>Simulado terminado!</h2>

<div class="pontuacao" id="pontuacao"></div>

<p id="mensagem"></p>

<button class="btn proxima" onclick="inicio()">
Voltar às categorias
</button>

</div>

</div>


<script>

/* ================================
   BANCO DE PERGUNTAS
================================ */

const perguntas = {

analises:[

{
pergunta:"Qual é a principal função dos eritrócitos?",
opcoes:[
"Transportar oxigénio",
"Produzir anticorpos",
"Produzir plaquetas",
"Destruir bactérias"
],
resposta:0,
explicacao:"Os eritrócitos transportam principalmente oxigénio através da hemoglobina."
},

{
pergunta:"Qual célula participa principalmente na defesa do organismo?",
opcoes:[
"Eritrócito",
"Leucócito",
"Plaqueta",
"Reticulócito"
],
resposta:1,
explicacao:"Os leucócitos participam nas respostas imunológicas e na defesa do organismo."
},

{
pergunta:"Qual exame avalia os elementos celulares do sangue?",
opcoes:[
"Hemograma",
"Urinálise",
"Coprologia",
"Espermatograma"
],
resposta:0,
explicacao:"O hemograma avalia principalmente eritrócitos, leucócitos e plaquetas."
}

],

cultura:[

{
pergunta:"Qual é a capital de Angola?",
opcoes:[
"Luanda",
"Lubango",
"Huambo",
"Benguela"
],
resposta:0,
explicacao:"Luanda é a capital de Angola."
},

{
pergunta:"Qual é a moeda oficial de Angola?",
opcoes:[
"Metical",
"Kwanza",
"Rand",
"Euro"
],
resposta:1,
explicacao:"O Kwanza é a moeda oficial de Angola."
}

],

etica:[

{
pergunta:"O que significa sigilo profissional?",
opcoes:[
"Divulgar informações dos pacientes",
"Proteger informações confidenciais",
"Publicar resultados laboratoriais",
"Partilhar informações com qualquer pessoa"
],
resposta:1,
explicacao:"O sigilo profissional exige proteção das informações confidenciais obtidas no exercício profissional."
},

{
pergunta:"A ética profissional orienta principalmente:",
opcoes:[
"A conduta do profissional",
"O preço dos medicamentos",
"A decoração do laboratório",
"A publicidade"
],
resposta:0,
explicacao:"A ética profissional ajuda a orientar decisões e comportamentos responsáveis."
}

],

censo:[

{
pergunta:"Segundo o Censo 2024, qual era a população residente de Angola?",
opcoes:[
"36 604 681",
"20 000 000",
"50 000 000",
"15 000 000"
],
resposta:0,
explicacao:"Segundo os resultados definitivos do Censo 2024, Angola tinha 36 604 681 habitantes."
}

],

iims:[

{
pergunta:"O que significa IIMS?",
opcoes:[
"Inquérito de Indicadores Múltiplos e de Saúde",
"Instituto Internacional de Medicina Social",
"Índice Integrado de Medicina Sanitária",
"Inquérito Internacional de Medicina"
],
resposta:0,
explicacao:"IIMS significa Inquérito de Indicadores Múltiplos e de Saúde."
}

],

ia:[

{
pergunta:"O que significa IA?",
opcoes:[
"Informação Administrativa",
"Inteligência Artificial",
"Internet Avançada",
"Inteligência Analógica"
],
resposta:1,
explicacao:"IA significa Inteligência Artificial."
},

{
pergunta:"Por que devemos verificar informações produzidas por uma IA?",
opcoes:[
"Porque uma IA pode cometer erros",
"Porque IA nunca funciona",
"Porque computadores não usam dados",
"Porque toda IA é falsa"
],
resposta:0,
explicacao:"Sistemas de IA podem produzir informações incorretas ou inadequadas, por isso a verificação humana é importante."
}

]

};


/* ================================
   VARIÁVEIS
================================ */

let categoriaAtual="";
let lista=[];
let numero=0;
let pontos=0;
let respondeu=false;


/* ================================
   INICIAR
================================ */

function iniciar(categoria){

categoriaAtual=categoria;

lista=perguntas[categoria];

numero=0;

pontos=0;

respondeu=false;

document.getElementById("inicio").style.display="none";

document.getElementById("resultado").style.display="none";

document.getElementById("simulado").style.display="block";

document.getElementById("categoria").innerText=
"Categoria: "+categoria;

mostrar();

}


/* ================================
   MOSTRAR PERGUNTA
================================ */

function mostrar(){

let atual=lista[numero];

document.getElementById("contador").innerText=
"Questão "+(numero+1)+" de "+lista.length;

document.getElementById("pergunta").innerText=
atual.pergunta;

let area=document.getElementById("opcoes");

area.innerHTML="";

document.getElementById("explicacao").style.display="none";

atual.opcoes.forEach(function(opcao,index){

let botao=document.createElement("button");

botao.className="opcao";

botao.innerText=
String.fromCharCode(65+index)+") "+opcao;

botao.onclick=function(){

responder(index);

};

area.appendChild(botao);

});

}


/* ================================
   RESPONDER
================================ */

function responder(escolha){

if(respondeu){
return;
}

respondeu=true;

let atual=lista[numero];

let botoes=
document.querySelectorAll(".opcao");

botoes.forEach(function(botao,index){

botao.disabled=true;

if(index===atual.resposta){

botao.classList.add("certa");

}

if(index===escolha && escolha!==atual.resposta){

botao.classList.add("errada");

}

});


if(escolha===atual.resposta){

pontos++;

}


let explicacao=
document.getElementById("explicacao");

explicacao.innerText=
"💡 "+atual.explicacao;

explicacao.style.display="block";

}


/* ================================
   PRÓXIMA
================================ */

function proxima(){

if(!respondeu){

alert("Escolha uma resposta primeiro.");

return;

}

if(numero<lista.length-1){

numero++;

respondeu=false;

mostrar();

}else{

finalizar();

}

}


/* ================================
   VOLTAR
================================ */

function voltar(){

document.getElementById("simulado").style.display="none";

document.getElementById("inicio").style.display="block";

}


/* ================================
   FINALIZAR
================================ */

function finalizar(){

document.getElementById("simulado").style.display="none";

document.getElementById("resultado").style.display="block";

let total=lista.length;

let percentagem=
Math.round((pontos/total)*100);

document.getElementById("pontuacao").innerText=
pontos+" / "+total+" ("+percentagem+"%)";

if(percentagem>=80){

document.getElementById("mensagem").innerText=
"Excelente desempenho!";

}else if(percentagem>=60){

document.getElementById("mensagem").innerText=
"Bom desempenho. Continue a estudar.";

}else{

document.getElementById("mensagem").innerText=
"Precisa reforçar os estudos e tentar novamente.";

}

}


/* ================================
   INÍCIO
================================ */

function inicio(){

document.getElementById("resultado").style.display="none";

document.getElementById("inicio").style.display="block";

}

</script>

</body>
</html>
