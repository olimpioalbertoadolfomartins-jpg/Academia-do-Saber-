<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia de Simulados — Angola</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f5f8;color:#17202a}
header{background:#0b3d2e;color:#fff;padding:22px 15px;text-align:center}header h1{margin:0;font-size:25px}
header p{margin:7px 0;font-size:14px}.container{max-width:950px;margin:20px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.category{border:2px solid #ddd;background:#fff;border-radius:12px;padding:16px;text-align:left;cursor:pointer;font-weight:bold}
.category:hover{border-color:#0b3d2e;background:#f1f8f4}.category small{display:block;font-weight:normal;color:#666;margin-top:6px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}.badge,.timer{padding:8px 12px;border-radius:20px;font-weight:bold;font-size:13px}
.badge{background:#e8f5e9;color:#0b3d2e}.timer{background:#fff3cd;color:#7a5a00}
.progress{height:9px;background:#e1e5e8;border-radius:10px;overflow:hidden;margin-bottom:22px}.progress-bar{height:100%;width:0;background:#0b3d2e}
.question-number{color:#666;font-size:14px}.question{font-size:20px;font-weight:bold;line-height:1.45;margin:10px 0 20px}
.option{display:block;width:100%;text-align:left;border:2px solid #ddd;background:#fff;padding:14px;border-radius:10px;margin:10px 0;cursor:pointer;font-size:16px}
.option.selected{border-color:#0b3d2e;background:#e8f5e9}.navigation{display:flex;justify-content:space-between;gap:10px;margin-top:25px}
button.nav,.action{border:0;border-radius:9px;padding:13px 20px;font-size:15px;cursor:pointer}.prev{background:#e0e0e0}.next,.action{background:#0b3d2e;color:#fff}.finish{background:#8b0000!important}
.hidden{display:none}.result{text-align:center}.score{font-size:48px;font-weight:bold;color:#0b3d2e}
.result-box{margin:20px 0;padding:15px;background:#f5f5f5;border-radius:10px}.review{text-align:left;margin-top:25px}
.review-item{border:1px solid #ddd;border-radius:10px;padding:15px;margin-bottom:12px}.correct{color:#087f23;font-weight:bold}.wrong{color:#b00020;font-weight:bold}
.explanation{background:#f1f3f5;padding:10px;border-radius:8px;margin-top:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
select,input{padding:11px;border:1px solid #ccc;border-radius:8px;width:100%}.field{flex:1;min-width:220px}
@media(max-width:600px){.question{font-size:18px}.navigation{flex-direction:column}.nav{width:100%}}
</style>
</head>
<body>
<header><h1>Academia de Simulados — Angola</h1><p>Preparação para concursos públicos • Saúde • MININT</p></header>
<div class="container">
<section id="home" class="card">
<h2>Escolha a área</h2>
<p>Os conteúdos específicos permanecem separados. Censo, IIMS, DPA, ética, cultura geral e IA ficam apenas no bloco transversal.</p>
<div id="categories" class="grid"></div>
</section>

<section id="quiz" class="card hidden">
<div class="toolbar">
<button class="action" onclick="goHome()">← Áreas</button>
<button class="action" onclick="printExam()">🖨️ PDF / Imprimir</button>
</div>
<div class="top"><div class="badge" id="topic">Área</div><div class="timer" id="timer">60:00</div></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="question-number" id="questionNumber"></div>
<div class="question" id="question"></div>
<div id="options"></div>
<div class="navigation">
<button class="nav prev" id="prev" onclick="previousQuestion()">Anterior</button>
<button class="nav next" id="next" onclick="nextQuestion()">Próxima</button>
</div>
</section>

<section id="result" class="card result hidden">
<h2>Resultado</h2><div class="score" id="score"></div>
<div class="result-box"><p id="correctText"></p><p id="percentageText"></p><p id="timeText"></p></div>
<div class="toolbar" style="justify-content:center"><button class="action" onclick="printResult()">🖨️ PDF do resultado</button><button class="action" onclick="goHome()">Voltar às áreas</button></div>
<div class="review" id="review"></div>
</section>
</div>
<script>
let BANKS={},questions=[],current=0,answers=[],timeLeft=3600,timerInterval=null,area="";
const $=id=>document.getElementById(id);
fetch("data/questions.json").then(r=>r.json()).then(data=>{BANKS=data;renderCategories()}).catch(()=>alert("Não foi possível carregar data/questions.json. Mantenha a pasta data junto do index.html."));
function renderCategories(){
 const box=$("categories");box.innerHTML="";
 Object.entries(BANKS).forEach(([name,qs])=>{
  const b=document.createElement("button");b.className="category";
  b.innerHTML=name+"<small>"+qs.length+" questões disponíveis</small>";
  b.onclick=()=>startQuiz(name);box.appendChild(b);
 });
}
function startQuiz(name){
 area=name;questions=shuffle(BANKS[name].map(x=>({...x})));current=0;answers=new Array(questions.length).fill(null);timeLeft=3600;
 $("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
 clearInterval(timerInterval);startTimer();showQuestion();
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startTimer(){timerInterval=setInterval(()=>{timeLeft--;if(timeLeft<=0){clearInterval(timerInterval);finishQuiz();}updateTimer()},1000);updateTimer()}
function updateTimer(){let m=Math.floor(timeLeft/60),s=timeLeft%60;$("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function showQuestion(){
 let q=questions[current];$("topic").textContent=area+" • "+q.topic;$("questionNumber").textContent=`Questão ${current+1} de ${questions.length}`;$("question").textContent=q.q;
 let box=$("options");box.innerHTML="";
 q.options.forEach((o,i)=>{let b=document.createElement("button");b.className="option"+(answers[current]===i?" selected":"");b.textContent=String.fromCharCode(65+i)+") "+o;b.onclick=()=>{answers[current]=i;showQuestion()};box.appendChild(b)});
 $("progressBar").style.width=((current+1)/questions.length*100)+"%";$("prev").disabled=current===0;
 $("next").textContent=current===questions.length-1?"Finalizar prova":"Próxima";$("next").classList.toggle("finish",current===questions.length-1);
}
function nextQuestion(){if(current===questions.length-1)finishQuiz();else{current++;showQuestion()}}
function previousQuestion(){if(current>0){current--;showQuestion()}}
function finishQuiz(){
 clearInterval(timerInterval);let correct=questions.reduce((n,q,i)=>n+(answers[i]===q.answer?1:0),0),pct=Math.round(correct/questions.length*100);
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${correct}/${questions.length}`;
 $("correctText").textContent=`Acertos: ${correct} • Erros: ${questions.length-correct}`;
 $("percentageText").textContent=`Percentagem: ${pct}%`;
 $("timeText").textContent=`Tempo utilizado: ${formatTime(3600-timeLeft)}`;
 let r=$("review");r.innerHTML="<h3>Correção comentada</h3>";
 questions.forEach((q,i)=>{let ok=answers[i]===q.answer;let div=document.createElement("div");div.className="review-item";div.innerHTML=`<b>${i+1}. ${q.q}</b><p class="${ok?"correct":"wrong"}">${ok?"✓ Correta":"✗ Incorreta"} — Sua resposta: ${answers[i]==null?"Não respondida":String.fromCharCode(65+answers[i])+") "+q.options[answers[i]]}</p><p><b>Resposta:</b> ${String.fromCharCode(65+q.answer)}) ${q.options[q.answer]}</p><div class="explanation">${q.explanation}</div>`;r.appendChild(div)})
}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function goHome(){clearInterval(timerInterval);$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden")}
function printExam(){window.print()}
function printResult(){window.print()}
</script>
</body>
</html>
